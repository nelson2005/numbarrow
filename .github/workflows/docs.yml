name: docs

on:
  push:
    branches: [ "main" ]
  # Build on pull requests too, without deploying. On push alone the -W below
  # first runs when a branch is already merged, so a docs regression reaches
  # main, and the same job publishes, before anything reports it.
  pull_request:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numbarrow
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install doc dependencies
        run: pip install .[docs]

      - name: Build docs
        # -W: the build emits no warnings, and without this a malformed
        # directive or an unterminated literal only prints one and the job
        # still passes. numbox already builds this way.
        run: sphinx-build -W -b html docs/ docs/_build/html

      - name: Deploy to GitHub Pages
        # Only main publishes. A pull request builds to prove the docs are
        # sound and stops there.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_build/html
          force_orphan: true
